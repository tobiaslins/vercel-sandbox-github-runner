name: Sandbox runner smoke test

on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: vercel-sandbox-${{ github.run_id }}-${{ github.run_attempt }}
    timeout-minutes: 15
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: uname -a
      - run: node --version
      - run: docker version
      - run: docker run --rm alpine:3.22 echo "Docker works"
      - run: node -e "const net=require('node:net'); const socket=net.connect(6379, '127.0.0.1', () => socket.end()); socket.on('error', error => { throw error })"
